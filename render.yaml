# Render Blueprint — deploys the static PWA (free).
# In Render: New → Blueprint → pick this repo. A static site has no server, so
# exercise demos are not available this way (see README → Deploy).
services:
  - type: web
    name: gym-coach-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
